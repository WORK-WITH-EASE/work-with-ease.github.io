<!doctype html>
<html lang="de">
<head>
<meta name="robots" content="noindex,follow">
<meta name="googlebot" content="noindex,indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICK-Chart: Aufgaben nach Nutzen und Aufwand priorisieren</title>
<style>
/* Schrift der Website; einzeln geöffnet greift die Ersatzschrift. Immer hell wie die Website. */
@font-face { font-family: Space; src: url('/assets/space-grotesk.ttf') format('truetype'); font-weight: 300 700; font-display: swap; }
:root {
  color-scheme: light;
  --ink: #092f26;
  --muted: #52685c;
  --line: #d6ddd1;
  --paper: #fff;
  --soft: #f5f7f2;
  --pink: #ff1693;
  --possible: #eceee8; --possible-ink: #52685c;
  --implement: #e4f8a8; --implement-ink: #3b6500;
  --challenge: #dceaff; --challenge-ink: #1b56ad;
  --kill: #ffe1ef; --kill-ink: #b8005f;
  --font: Space, -apple-system, ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
}
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h2 { font-size: 17px; font-weight: 600; margin: 0; }
.pick { display: grid; gap: 26px; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
button { cursor: pointer; border: 1px solid var(--ink); border-radius: 6px; background: #fff; padding: 6px 12px; }
button.haupt { background: var(--ink); color: #fff; }
button.leise { border-color: var(--line); color: var(--muted); }
button:disabled { cursor: default; opacity: .35; }
.possible { background: var(--possible); color: var(--possible-ink); }
.implement { background: var(--implement); color: var(--implement-ink); }
.challenge { background: var(--challenge); color: var(--challenge-ink); }
.kill { background: var(--kill); color: var(--kill-ink); }

/* Only after "Matrix anzeigen": ranks, fields, values, filter, sorting and the matrix itself. */
.pick:not(.ergebnis) .nur-ergebnis { display: none !important; }
.pick.ergebnis .nur-bewerten { display: none !important; }
.pick.ergebnis #liste li.ausgefiltert { display: none; }

/* Wahl als Pillen */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.wahl { display: flex; flex-wrap: wrap; gap: 6px; }
.wahl label, .filter label { cursor: pointer; }
.wahl input, .filter input { position: absolute; opacity: 0; pointer-events: none; }
.wahl span { display: inline-block; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; }
.wahl input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.wahl input:focus-visible + span, .filter input:focus-visible + span { outline: 2px solid var(--pink); outline-offset: 2px; }

/* Liste */
.leiste { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; }
.filter > span { color: var(--muted); }
.filter label span { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; }
.filter input:not(:checked) + span { background: #fff; border-color: var(--line); color: var(--muted); text-decoration: line-through; }
.zeile { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) minmax(170px, 16em) 1.8em; align-items: center; gap: 6px 14px; }
.kopf { margin-top: 12px; padding-bottom: 4px; font-size: 12px; color: var(--muted); }
.nur-schmal { display: none; }
.kopf .skala { grid-column: 3; display: flex; justify-content: space-between; padding-left: 4.4em; }
#liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
#liste li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.listenrahmen { position: relative; }
.vorn { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.rang { font-weight: 650; text-align: right; color: var(--muted); }
.pick.ergebnis .rang { color: var(--ink); }
.griff { display: grid; place-items: center; border: 0; background: none; padding: 6px 4px; color: var(--muted); cursor: grab; touch-action: none; }
.griff:hover { color: var(--ink); }
/* Drag and drop: the lifted row follows the pointer, a pink line marks where it will land. */
#liste li.gezogen { position: relative; z-index: 2; background: #fff; box-shadow: 0 10px 28px rgb(9 47 38 / .22); border-radius: 8px; }
body.ziehen, body.ziehen * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
#linie { position: absolute; left: 0; right: 0; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--pink); pointer-events: none; z-index: 3; }
#linie::before, #linie::after { content: ''; position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); }
#linie::before { left: 0; }
#linie::after { right: 0; }
.titel { display: block; box-sizing: border-box; width: 100%; resize: none; overflow: hidden; field-sizing: content; min-height: 0; padding: 6px 8px; line-height: 1.35; border: 1px solid transparent; border-radius: 6px; background: transparent; }
.titel:hover { border-color: var(--line); }
.titel:focus { border-color: var(--line); background: #fff; outline: none; }
.titel:focus-visible { outline: 2px solid var(--pink); outline-offset: 0; }
.info { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.wert { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.regler { display: grid; grid-template-columns: 4.4em minmax(0, 1fr); align-items: center; row-gap: 2px; font-size: 12.5px; color: var(--muted); }
.regler input { width: 100%; margin: 0; accent-color: var(--ink); }
.werkzeug { display: flex; justify-content: flex-end; }
.werkzeug .weg { border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
.weg:hover { color: var(--kill-ink); }
.unter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.leer { margin: 12px 0 0; color: var(--muted); }
@media (max-width: 560px) {
  .zeile { grid-template-columns: 3.4em minmax(0, 1fr) auto; }
  .kopf { display: none; }
  .nur-schmal { display: block; margin: 10px 0 6px; }
  .regler { grid-column: 2; grid-row: 2; padding: 4px 8px 0; }
  .werkzeug { grid-column: 3; grid-row: 1 / span 2; }
}

/* Matrix */
.anzeigen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 18px; border: 1px dashed var(--line); border-radius: 10px; background: var(--soft); }
.anzeigen p { flex: 1 1 260px; margin: 0; font-size: 14px; color: var(--muted); }
.ergebnisfeld { display: grid; gap: 18px; }
.ergebnisfeld figure { width: 100%; max-width: 680px; justify-self: center; }
figure { position: relative; margin: 0; }
#tipp { position: absolute; z-index: 1; max-width: 240px; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 13px; line-height: 1.35; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
#tipp small { display: block; opacity: .75; font-size: 11.5px; }
#matrix .punkt { cursor: pointer; outline: none; }
#matrix .punkt:hover circle, #matrix .punkt:focus-visible circle, #matrix .punkt.aktiv circle { fill: var(--pink); }
#matrix { display: block; width: 100%; height: auto; }
#matrix .q-name { font-size: 19px; font-weight: 650; }
#matrix .q-klein { font-size: 12px; font-weight: 500; }
#matrix .achse { font-size: 12px; fill: var(--muted); }
#matrix .punkt circle { fill: var(--ink); stroke: #fff; stroke-width: 2; }
#matrix .punkt text { fill: #fff; font-size: 11px; font-weight: 600; }
#matrix .punkt.aus { opacity: .28; }
/* Weighting below the matrix, in one row: question, choices, explanation. */
.karte { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--soft); }
.karte legend { float: left; padding: 0; font-size: 13px; font-weight: 600; }
.erklaerung { flex: 1 0 100%; margin: 0; font-size: 12.5px; color: var(--muted); }
.hinweis { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

.aktionen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.aktionen select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.trenner { flex: 1 1 0; }
#meldung { min-height: 1.45em; margin: -14px 0 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="pick" id="pick">
  <section aria-labelledby="liste-titel">
    <div class="leiste">
      <h2 id="liste-titel"><span class="nur-bewerten">Aufgaben einschätzen</span><span class="nur-ergebnis">Prioritätenliste</span></h2>
      <fieldset class="wahl nur-ergebnis" aria-label="Sortierung">
        <label><input type="radio" name="sortierung" value="auto"><span>automatisch</span></label>
        <label><input type="radio" name="sortierung" value="manuell"><span>manuell</span></label>
      </fieldset>
    </div>
    <div class="filter nur-ergebnis" id="filter" role="group" aria-label="Felder anzeigen"><span>Anzeigen:</span></div>
    <div class="zeile kopf" aria-hidden="true"><span></span><span>Aufgabe oder Projekt</span><span class="skala"><span>gering</span><span>hoch</span></span><span></span></div>
    <p class="hinweis nur-schmal">Regler: links gering, rechts hoch.</p>
    <div class="listenrahmen"><ol id="liste"></ol><div id="linie" hidden></div></div>
    <p class="leer" id="leer" hidden></p>
    <div class="unter">
      <button type="button" id="neu">+ Aufgabe</button>
      <button type="button" class="leise" id="leeren">Liste leeren</button>
      <button type="button" class="leise" id="beispiele">Beispiele</button>
    </div>
  </section>

  <section aria-label="PICK-Chart">
    <div class="anzeigen nur-bewerten">
      <p>Die Matrix ist ausgeblendet, damit Sie jede Aufgabe für sich einschätzen. Stehen alle Regler, lassen Sie sich vom Ergebnis überraschen.</p>
      <button type="button" class="haupt" id="anzeigen">Matrix anzeigen</button>
    </div>
    <div class="ergebnisfeld nur-ergebnis">
      <figure>
        <svg id="matrix" viewBox="0 0 400 400" role="img" aria-labelledby="matrix-text">
          <title id="matrix-text">PICK-Chart: Aufgaben nach Nutzen (senkrecht) und Aufwand (waagerecht) in vier Feldern</title>
        </svg>
        <div id="tipp" hidden></div>
        <figcaption class="hinweis">Die Zahlen sind die Plätze in der Prioritätenliste; zeigen oder tippen Sie auf einen Punkt für den Namen. Bewegen Sie einen Regler, verschwindet die Matrix wieder.</figcaption>
      </figure>
      <fieldset class="karte">
        <legend>Bei gleichem Verhältnis zählt mehr …</legend>
        <div class="wahl">
          <label><input type="radio" name="gewicht" value="gleich"><span>beides gleich</span></label>
          <label><input type="radio" name="gewicht" value="nutzen"><span>der Nutzen</span></label>
          <label><input type="radio" name="gewicht" value="aufwand"><span>der geringe Aufwand</span></label>
        </div>
        <p class="erklaerung" id="gewicht-text"></p>
      </fieldset>
    </div>
  </section>

  <div class="aktionen">
    <select id="format" aria-label="Format zum Kopieren">
      <option value="liste">als Liste</option>
      <option value="markdown">als Checkliste (Markdown)</option>
      <option value="tabelle">als Tabelle (Excel)</option>
    </select>
    <button type="button" id="kopieren">Kopieren</button>
    <span class="trenner"></span>
    <button type="button" class="leise" id="csv-speichern">CSV herunterladen</button>
    <button type="button" class="leise" id="csv-laden">CSV laden</button>
    <input type="file" id="datei" accept=".csv,text/csv,text/plain" hidden>
  </div>
  <p id="meldung" role="status"></p>
</main>

<script>
(() => {
  // Quadrants of the PICK chart, read clockwise from bottom left. From 50 up a value counts as high.
  const FELDER = {
    possible: { name: 'Possible', klein: 'Lückenfüller', x: 'links', y: 'unten' },
    implement: { name: 'Implement', klein: 'Quick Win', x: 'links', y: 'oben' },
    challenge: { name: 'Challenge', klein: 'Großes Projekt', x: 'rechts', y: 'oben' },
    kill: { name: 'Kill', klein: 'Streichen', x: 'rechts', y: 'unten' },
  };
  const feld = a => a.nutzen >= 50 ? (a.aufwand < 50 ? 'implement' : 'challenge') : (a.aufwand < 50 ? 'possible' : 'kill');

  // Order: value divided by effort. The exponents decide ties of the plain ratio (10:10 against 90:90).
  const GEWICHTE = {
    gleich: { n: 1, a: 1, text: 'Reihenfolge nach Nutzen geteilt durch Aufwand. Ist das Verhältnis gleich, kommt der größere Nutzen zuerst.' },
    nutzen: { n: 1.5, a: 1, text: 'Der Nutzen zählt stärker: Bei gleichem Verhältnis steht die Aufgabe mit mehr Nutzen deutlich vorn, auch wenn sie mehr Mühe macht.' },
    aufwand: { n: 1, a: 1.5, text: 'Der Aufwand zählt stärker: Bei gleichem Verhältnis steht die Aufgabe vorn, die weniger Mühe macht.' },
  };
  // Score from 1 (low value, high effort) to 10 (high value, low effort) on a logarithmic scale.
  function wert(a) {
    const g = GEWICHTE[state.gewicht];
    const tief = -g.a * Math.log(100), hoch = g.n * Math.log(100);
    return 1 + 9 * (g.n * Math.log(a.nutzen) - g.a * Math.log(a.aufwand) - tief) / (hoch - tief);
  }
  const zahl = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const stufe = v => v < 20 ? 'sehr gering' : v < 40 ? 'gering' : v < 60 ? 'mittel' : v < 80 ? 'hoch' : 'sehr hoch';

  const BEISPIELE = [
    ['Angebotsvorlage überarbeiten', 78, 22],
    ['Rechnungen per E-Mail statt per Post verschicken', 70, 15],
    ['Ablage digitalisieren', 80, 80],
    ['Neue Website', 85, 88],
    ['Kundendaten an einem Ort sammeln', 66, 58],
    ['E-Mail-Signaturen vereinheitlichen', 32, 14],
    ['Bestellung von Büromaterial automatisieren', 20, 20],
    ['Auf allen Social-Media-Kanälen posten', 24, 82],
    ['Altes Intranet weiterpflegen', 14, 70],
  ];
  const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const beispiele = () => BEISPIELE.map(([name, nutzen, aufwand]) => ({ id: neueId(), name, nutzen, aufwand }));

  // State, kept in this browser only. "reihe" is the order of the list; it changes only on "Matrix anzeigen",
  // when the sorting or weighting changes, or when the reader moves a task.
  const SPEICHER = 'wwe-pick-chart-2';
  let state = { aufgaben: beispiele(), reihe: [], manuell: [], sortierung: 'auto', gewicht: 'gleich', aus: {}, ergebnis: true };
  try { const s = JSON.parse(localStorage.getItem(SPEICHER)); if (s && Array.isArray(s.aufgaben)) state = { ...state, ...s }; } catch {}
  const speichern = () => { try { localStorage.setItem(SPEICHER, JSON.stringify(state)); } catch {} };

  const automatisch = () => [...state.aufgaben].sort((x, y) => {
    const d = wert(y) - wert(x);
    if (Math.abs(d) > 1e-9) return d;
    return y.nutzen - x.nutzen || x.aufwand - y.aufwand || x.name.localeCompare(y.name, 'de');
  });
  // The manual order is kept on its own, so switching to "automatisch" and back restores it.
  // Tasks added since then go to its end, in the order the list shows them.
  function sortieren() {
    if (state.sortierung === 'auto') { state.reihe = automatisch().map(a => a.id); return; }
    const da = new Set(state.aufgaben.map(a => a.id));
    const manuell = (state.manuell || []).filter(id => da.has(id));
    state.reihe = [...manuell, ...reihenfolge().map(a => a.id).filter(id => !manuell.includes(id))];
  }
  // The tasks in list order; tasks missing from "reihe" go to the end.
  function reihenfolge() {
    const nachId = new Map(state.aufgaben.map(a => [a.id, a]));
    const liste = state.reihe.map(id => nachId.get(id)).filter(Boolean);
    return [...liste, ...state.aufgaben.filter(a => !liste.includes(a))];
  }
  const sichtbar = () => reihenfolge().filter(a => !state.aus[feld(a)]);
  if (!state.reihe.length) sortieren();

  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kinder) => { const n = Object.assign(document.createElement(tag), props); n.append(...kinder); return n; };
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = (tag, attrs = {}, text) => { const n = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; return n; };
  const melden = text => { $('meldung').textContent = text; };
  const ohneTitel = a => a.name || 'Neue Aufgabe';

  // Matrix: drawing area in SVG units, quadrants once, the points on each "Matrix anzeigen".
  const X0 = 34, Y0 = 6, B = 360;
  const punkte = svg('g');
  (function zeichneFelder() {
    const h = B / 2, g = svg('g');
    for (const [key, f] of Object.entries(FELDER)) {
      const x = f.x === 'links' ? X0 : X0 + h, y = f.y === 'oben' ? Y0 : Y0 + h;
      g.append(svg('rect', { x, y, width: h, height: h, fill: `var(--${key})` }));
      const tx = f.x === 'links' ? x + 12 : x + h - 12, anker = f.x === 'links' ? 'start' : 'end';
      const ty = f.y === 'oben' ? y + 26 : y + h - 28;
      g.append(svg('text', { x: tx, y: ty, 'text-anchor': anker, class: 'q-name', fill: `var(--${key}-ink)` }, f.name));
      g.append(svg('text', { x: tx, y: ty + 16, 'text-anchor': anker, class: 'q-klein', fill: `var(--${key}-ink)` }, f.klein));
    }
    g.append(svg('rect', { x: X0, y: Y0, width: B, height: B, fill: 'none', stroke: 'var(--line)' }));
    g.append(svg('text', { x: X0, y: Y0 + B + 18, class: 'achse' }, 'gering'));
    g.append(svg('text', { x: X0 + B / 2, y: Y0 + B + 18, class: 'achse', 'text-anchor': 'middle', 'font-weight': 600 }, 'Aufwand →'));
    g.append(svg('text', { x: X0 + B, y: Y0 + B + 18, class: 'achse', 'text-anchor': 'end' }, 'hoch'));
    const links = (y, text, extra = {}) => svg('text', { x: 0, y: 0, class: 'achse', transform: `translate(${X0 - 10} ${y}) rotate(-90)`, ...extra }, text);
    g.append(links(Y0 + B, 'gering'), links(Y0 + B / 2, 'Nutzen →', { 'text-anchor': 'middle', 'font-weight': 600 }), links(Y0, 'hoch', { 'text-anchor': 'end' }));
    $('matrix').append(g, punkte);
  })();

  // Tooltip with the task's name above a point; mouse, keyboard and touch.
  function tipp(punkt, name, info) {
    document.querySelectorAll('#matrix .aktiv').forEach(x => x.classList.remove('aktiv'));
    if (!punkt) { $('tipp').hidden = true; return; }
    punkt.classList.add('aktiv');
    $('tipp').replaceChildren(name, el('small', { textContent: info }));
    const box = punkt.getBoundingClientRect(), rahmen = $('tipp').parentElement.getBoundingClientRect();
    $('tipp').hidden = false;
    const halb = $('tipp').offsetWidth / 2;
    $('tipp').style.left = Math.min(Math.max(box.left + box.width / 2 - rahmen.left, halb), rahmen.width - halb) + 'px';
    $('tipp').style.top = box.top - rahmen.top + 'px';
  }
  document.addEventListener('pointerdown', e => { if (!e.target.closest?.('.punkt')) tipp(null); });

  function zeichneMatrix() {
    tipp(null);
    const rang = new Map(sichtbar().map((a, i) => [a.id, i + 1]));
    // Lower ranks drawn last, so that rank 1 lies on top.
    punkte.replaceChildren(...[...reihenfolge()].reverse().map(a => {
      const nr = rang.get(a.id);
      const p = svg('g', { class: 'punkt' + (nr ? '' : ' aus'), transform: `translate(${X0 + a.aufwand / 100 * B} ${Y0 + (1 - a.nutzen / 100) * B})`, tabindex: 0, role: 'img',
        'aria-label': `${nr ? nr + '. ' : ''}${ohneTitel(a)}: ${FELDER[feld(a)].name}, Nutzen ${stufe(a.nutzen)}, Aufwand ${stufe(a.aufwand)}` });
      p.append(svg('circle', { r: 11 }), svg('text', { 'text-anchor': 'middle', dy: '0.35em' }, nr ?? ''));
      const zeigen = () => tipp(p, `${nr ? nr + '. ' : ''}${ohneTitel(a)}`, `${FELDER[feld(a)].name} · Nutzen ${stufe(a.nutzen)}, Aufwand ${stufe(a.aufwand)}`);
      p.addEventListener('pointerenter', zeigen);
      p.addEventListener('focus', zeigen);
      p.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tipp(null); });
      p.addEventListener('blur', () => tipp(null));
      return p;
    }));
  }

  function regler(a, key, label) {
    const r = el('input', { type: 'range', min: 1, max: 100, value: a[key], ariaLabel: `${label} von „${ohneTitel(a)}“` });
    r.setAttribute('aria-valuetext', stufe(a[key]));
    // Changing an estimate hides the result; the list keeps its order until the matrix is shown again.
    r.addEventListener('input', () => {
      a[key] = +r.value;
      r.setAttribute('aria-valuetext', stufe(a[key]));
      if (state.ergebnis) { state.ergebnis = false; $('pick').classList.remove('ergebnis'); }
      speichern();
    });
    return [el('span', { textContent: label, ariaHidden: 'true' }), r];
  }

  function zeichneListe() {
    const sicht = new Set(sichtbar().map(a => a.id));
    let platz = 0;
    const liste = reihenfolge();
    $('liste').replaceChildren(...liste.map((a, i) => {
      const f = feld(a);
      // A text area, so that long titles wrap; Enter adds the next task instead of a line break.
      const titel = el('textarea', { className: 'titel', value: a.name, placeholder: 'Neue Aufgabe', maxLength: 120, rows: 1, ariaLabel: 'Aufgabe oder Projekt' });
      titel.addEventListener('input', () => { titel.value = titel.value.replace(/\s*\n\s*/g, ' '); a.name = titel.value.trim(); hoehe(titel); speichern(); });
      titel.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); neueAufgabe(); } });
      const griff = el('button', { type: 'button', className: 'griff nur-ergebnis', title: 'Zum Verschieben ziehen', ariaLabel: `${ohneTitel(a)} verschieben (Pfeiltasten hoch und runter)` });
      griff.append(GRIFF.cloneNode(true));
      griff.addEventListener('pointerdown', e => ziehen(e, a));
      griff.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); perTaste(a.id, e.key === 'ArrowUp' ? -1 : 1); } });
      const weg = el('button', { type: 'button', className: 'weg', textContent: '×', title: 'löschen', ariaLabel: `${ohneTitel(a)} löschen` });
      weg.addEventListener('click', () => loeschen(a));
      const li = el('li', { className: 'zeile' + (sicht.has(a.id) ? '' : ' ausgefiltert') },
        el('div', { className: 'vorn' }, griff, el('span', { className: 'rang', textContent: sicht.has(a.id) ? ++platz + '.' : '' })),
        el('div', {}, titel, el('div', { className: 'info nur-ergebnis' },
          el('span', { className: 'chip ' + f, textContent: FELDER[f].name }),
          el('span', { className: 'wert', textContent: 'Wert ' + zahl.format(wert(a)), title: 'von 1 (wenig Nutzen, viel Aufwand) bis 10 (viel Nutzen, wenig Aufwand)' }))),
        el('div', { className: 'regler' }, ...regler(a, 'nutzen', 'Nutzen'), ...regler(a, 'aufwand', 'Aufwand')),
        el('div', { className: 'werkzeug' }, weg));
      li.dataset.id = a.id;
      return li;
    }));
    const versteckt = state.aufgaben.length - sicht.size;
    $('leer').hidden = state.aufgaben.length > 0 && !(state.ergebnis && !sicht.size);
    $('leer').textContent = state.aufgaben.length ? `Alle ${versteckt} Aufgaben sind ausgeblendet.` : 'Noch keine Aufgaben. Mit „+ Aufgabe“ eine eintragen oder „Beispiele“ laden.';
  }

  // Browsers without field-sizing get the height of the text from here.
  function hoehe(t) { if (CSS.supports('field-sizing', 'content')) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
  new ResizeObserver(() => document.querySelectorAll('.titel').forEach(hoehe)).observe(document.body);

  function zeichneFilter() {
    const zaehler = Object.fromEntries(Object.keys(FELDER).map(k => [k, 0]));
    for (const a of state.aufgaben) zaehler[feld(a)]++;
    for (const key of Object.keys(FELDER)) {
      $('filter-' + key).checked = !state.aus[key];
      $('filter-' + key).nextElementSibling.textContent = `${FELDER[key].name} · ${FELDER[key].klein} (${zaehler[key]})`;
    }
  }

  function zeichnen() {
    $('pick').classList.toggle('ergebnis', state.ergebnis);
    zeichneListe();
    document.querySelectorAll('.titel').forEach(hoehe);
    zeichneFilter();
    zeichneMatrix();
    for (const r of document.querySelectorAll('input[name=sortierung]')) r.checked = r.value === state.sortierung;
    for (const r of document.querySelectorAll('input[name=gewicht]')) r.checked = r.value === state.gewicht;
    $('gewicht-text').textContent = GEWICHTE[state.gewicht].text;
  }
  const aendern = () => { speichern(); zeichnen(); };

  $('anzeigen').addEventListener('click', () => {
    state.ergebnis = true;
    sortieren();
    aendern();
    melden(state.sortierung === 'auto' ? 'Die Liste ist neu sortiert.' : 'Die Liste behält Ihre manuelle Reihenfolge.');
  });

  function neueAufgabe() {
    const a = { id: neueId(), name: '', nutzen: 50, aufwand: 50 };
    state.aufgaben.push(a);
    state.reihe.push(a.id);
    state.ergebnis = false;
    aendern();
    $('liste').lastElementChild.querySelector('.titel').focus();
  }
  $('neu').addEventListener('click', neueAufgabe);

  function loeschen(a) {
    state.aufgaben = state.aufgaben.filter(x => x !== a);
    state.reihe = state.reihe.filter(id => id !== a.id);
    aendern();
    melden(`„${ohneTitel(a)}“ gelöscht.`);
  }

  // Moving by hand switches to manual order.
  function verschieben(id, nebenId, wo) {
    if (id === nebenId) return;
    if (state.sortierung === 'auto') melden('Sortierung ist jetzt manuell. „Automatisch“ stellt die berechnete Reihenfolge wieder her.');
    const reihe = reihenfolge().map(a => a.id).filter(x => x !== id);
    reihe.splice(reihe.indexOf(nebenId) + (wo === 'nach' ? 1 : 0), 0, id);
    state.reihe = reihe;
    state.manuell = [...reihe];
    state.sortierung = 'manuell';
    aendern();
  }

  // Grip of six dots at the front of each row.
  const GRIFF = svg('svg', { viewBox: '0 0 10 16', width: 10, height: 16, 'aria-hidden': 'true' });
  for (const [x, y] of [[2, 2], [8, 2], [2, 8], [8, 8], [2, 14], [8, 14]]) GRIFF.append(svg('circle', { cx: x, cy: y, r: 1.6, fill: 'currentColor' }));

  // Keyboard: arrow keys on the grip move the task by one place among the visible ones.
  function perTaste(id, schritt) {
    const ids = sichtbar().map(a => a.id), ziel = ids[ids.indexOf(id) + schritt];
    if (!ziel) return;
    verschieben(id, ziel, schritt < 0 ? 'vor' : 'nach');
    $('liste').querySelector(`li[data-id="${id}"] .griff`)?.focus();
  }

  // Drag and drop with the grip, for mouse and touch. Positions are taken in the top window, because the tool
  // usually sits in an article's iframe that is as tall as its content; near the window's edges the page scrolls.
  function ziehen(e, a) {
    if (e.button > 0) return;
    e.preventDefault();
    const griff = e.currentTarget, li = griff.closest('li');
    griff.setPointerCapture?.(e.pointerId);
    const rahmen = window.frameElement, fenster = rahmen ? window.parent : window;
    const rahmenOben = () => rahmen ? rahmen.getBoundingClientRect().top : 0;
    let bildY = rahmenOben() + e.clientY;
    const seitenY = () => bildY - rahmenOben() + window.scrollY;
    const start = seitenY();
    const alle = [...$('liste').children].filter(z => getComputedStyle(z).display !== 'none');
    const andere = alle.filter(z => z !== li), eigen = alle.indexOf(li);
    let ziel = null, bewegt = false, lauf = 0;

    function aktualisieren() {
      const y = seitenY();
      if (!bewegt && Math.abs(y - start) < 4) return;
      if (!bewegt) { bewegt = true; li.classList.add('gezogen'); document.body.classList.add('ziehen'); }
      li.style.transform = `translateY(${y - start}px)`;
      const davor = andere.find(z => { const b = z.getBoundingClientRect(); return y < b.top + window.scrollY + b.height / 2; });
      ziel = davor ? { id: davor.dataset.id, wo: 'vor' } : andere.length ? { id: andere.at(-1).dataset.id, wo: 'nach' } : null;
      // Dropping right where it came from changes nothing: no line then.
      if (ziel && ((ziel.wo === 'vor' && alle[eigen + 1]?.dataset.id === ziel.id) || (ziel.wo === 'nach' && alle[eigen - 1]?.dataset.id === ziel.id))) ziel = null;
      $('linie').hidden = !ziel;
      if (ziel) {
        const z = $('liste').querySelector(`li[data-id="${ziel.id}"]`);
        $('linie').style.top = (ziel.wo === 'vor' ? z.offsetTop : z.offsetTop + z.offsetHeight) + 'px';
      }
    }
    function scrollen() {
      const hoehe = fenster.innerHeight, rand = 70;
      const d = bildY < rand ? bildY - rand : bildY > hoehe - rand ? bildY - (hoehe - rand) : 0;
      if (bewegt && d) { fenster.scrollBy(0, Math.round(d / 4)); aktualisieren(); }
      lauf = requestAnimationFrame(scrollen);
    }
    const bewegen = ev => { bildY = rahmenOben() + ev.clientY; aktualisieren(); };
    const ende = ev => {
      cancelAnimationFrame(lauf);
      griff.removeEventListener('pointermove', bewegen);
      griff.removeEventListener('pointerup', ende);
      griff.removeEventListener('pointercancel', ende);
      li.classList.remove('gezogen');
      li.style.transform = '';
      document.body.classList.remove('ziehen');
      $('linie').hidden = true;
      if (ev.type === 'pointerup' && ziel) {
        verschieben(a.id, ziel.id, ziel.wo);
        $('liste').querySelector(`li[data-id="${a.id}"] .griff`)?.focus({ preventScroll: true });
      }
    };
    griff.addEventListener('pointermove', bewegen);
    griff.addEventListener('pointerup', ende);
    griff.addEventListener('pointercancel', ende);
    lauf = requestAnimationFrame(scrollen);
  }

  for (const key of Object.keys(FELDER)) {
    const box = el('input', { type: 'checkbox', id: 'filter-' + key });
    box.addEventListener('change', () => { state.aus[key] = !box.checked; aendern(); });
    $('filter').append(el('label', {}, box, el('span', { className: key })));
  }
  document.querySelectorAll('input[name=sortierung]').forEach(r => r.addEventListener('change', () => {
    // The first switch to "manuell" starts from the order on screen.
    if (r.value === 'manuell' && !state.manuell?.length) state.manuell = reihenfolge().map(a => a.id);
    state.sortierung = r.value; sortieren(); aendern();
  }));
  document.querySelectorAll('input[name=gewicht]').forEach(r => r.addEventListener('change', () => { state.gewicht = r.value; sortieren(); aendern(); }));

  // Copy: what the list shows, in its order. Task apps such as Todoist or Things turn pasted lines into tasks.
  const mitTitel = liste => liste.filter(a => a.name);
  function text(format) {
    const liste = mitTitel(state.ergebnis ? sichtbar() : reihenfolge());
    if (format === 'markdown') return liste.map(a => `- [ ] ${a.name}`).join('\n');
    if (format === 'tabelle') return [['Rang', 'Aufgabe', 'Nutzen', 'Aufwand', 'Feld', 'Wert'], ...liste.map((a, i) => [i + 1, a.name, a.nutzen, a.aufwand, FELDER[feld(a)].name, zahl.format(wert(a))])].map(z => z.join('\t')).join('\n');
    return liste.map(a => a.name).join('\n');
  }
  $('kopieren').addEventListener('click', async () => {
    const inhalt = text($('format').value);
    if (!inhalt) { melden('Die Liste ist leer.'); return; }
    try { await navigator.clipboard.writeText(inhalt); }
    catch {
      const t = el('textarea', { value: inhalt });
      document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
    }
    melden(`${inhalt.split('\n').length - ($('format').value === 'tabelle' ? 1 : 0)} Aufgaben in die Zwischenablage kopiert.`);
  });

  // CSV with semicolons, as Excel in Germany expects; all tasks in list order.
  const csvFeld = v => /[;"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  $('csv-speichern').addEventListener('click', () => {
    const zeilen = [['Rang', 'Aufgabe', 'Nutzen', 'Aufwand', 'Feld'], ...mitTitel(reihenfolge()).map((a, i) => [i + 1, a.name, a.nutzen, a.aufwand, FELDER[feld(a)].name])];
    const blob = new Blob(['﻿' + zeilen.map(z => z.map(csvFeld).join(';')).join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const link = el('a', { href: URL.createObjectURL(blob), download: 'prioritaeten.csv' });
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    melden('CSV heruntergeladen: prioritaeten.csv');
  });

  function csvLesen(inhalt) {
    const t = inhalt.replace(/^﻿/, '');
    const erste = t.split(/\r?\n/)[0];
    const trenner = [';', '\t', ','].sort((x, y) => erste.split(y).length - erste.split(x).length)[0];
    const zeilen = [];
    let zeile = [], feldText = '', inAnf = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (inAnf) { if (c === '"' && t[i + 1] === '"') { feldText += '"'; i++; } else if (c === '"') inAnf = false; else feldText += c; }
      else if (c === '"') inAnf = true;
      else if (c === trenner) { zeile.push(feldText); feldText = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; zeile.push(feldText); zeilen.push(zeile); zeile = []; feldText = ''; }
      else feldText += c;
    }
    if (feldText || zeile.length) { zeile.push(feldText); zeilen.push(zeile); }
    const kopf = zeilen[0].map(s => s.trim().toLowerCase());
    const spalte = muster => kopf.findIndex(s => muster.test(s));
    let [iName, iNutzen, iAufwand, iRang] = [spalte(/^(aufgabe|name|titel|projekt|task|title)/), spalte(/^(nutzen|value|impact)/), spalte(/^(aufwand|effort)/), spalte(/^(rang|rank|nr)/)];
    let daten = zeilen.slice(1);
    if (iName < 0) { [iName, iNutzen, iAufwand, iRang] = [0, 1, 2, -1]; daten = zeilen; }
    const zahlAus = s => { const n = parseFloat(String(s ?? '').replace(',', '.')); return Number.isFinite(n) ? Math.max(1, Math.min(100, Math.round(n))) : 50; };
    return daten.filter(z => (z[iName] || '').trim())
      .map((z, i) => ({ id: neueId(), name: z[iName].trim().slice(0, 120), nutzen: zahlAus(z[iNutzen]), aufwand: zahlAus(z[iAufwand]), rang: iRang >= 0 ? parseFloat(z[iRang]) || i + 1 : i + 1 }))
      .sort((x, y) => x.rang - y.rang).map(({ rang, ...a }) => a);
  }
  $('csv-laden').addEventListener('click', () => $('datei').click());
  $('datei').addEventListener('change', async () => {
    const datei = $('datei').files[0];
    $('datei').value = '';
    if (!datei) return;
    const aufgaben = csvLesen(await datei.text());
    if (!aufgaben.length) { melden('In der Datei stehen keine Aufgaben. Erwartet: Spalten Aufgabe, Nutzen, Aufwand (1–100).'); return; }
    if (state.aufgaben.length && !confirm(`${aufgaben.length} Aufgaben laden und die jetzige Liste ersetzen?`)) return;
    state.aufgaben = aufgaben;
    state.reihe = aufgaben.map(a => a.id);
    state.manuell = [...state.reihe];
    state.ergebnis = false;
    aendern();
    melden(`${aufgaben.length} Aufgaben geladen, in der Reihenfolge der Datei.`);
  });

  $('beispiele').addEventListener('click', () => {
    if (state.aufgaben.length && !confirm('Die Beispiele laden und die jetzige Liste ersetzen?')) return;
    state.aufgaben = beispiele(); state.reihe = []; state.manuell = []; state.sortierung = 'auto'; state.ergebnis = true;
    sortieren(); aendern(); melden('Beispiele geladen.');
  });
  $('leeren').addEventListener('click', () => {
    if (state.aufgaben.length && !confirm('Alle Aufgaben löschen?')) return;
    state.aufgaben = []; state.reihe = []; state.manuell = []; state.ergebnis = false;
    aendern(); melden('Liste geleert.');
  });

  zeichnen();
})();
</script>
</body>
</html>
