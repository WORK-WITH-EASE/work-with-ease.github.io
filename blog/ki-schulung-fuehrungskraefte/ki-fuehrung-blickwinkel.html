<!doctype html>
<html lang="de">
<head>
<meta name="robots" content="noindex,follow">
<meta name="googlebot" content="noindex,indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI für Führungskräfte: fünf Blickwinkel</title>
<style>
/* Schrift der Website; einzeln geöffnet greift die Ersatzschrift. Immer hell wie die Website. */
@font-face { font-family: Space; src: url('/assets/space-grotesk.ttf') format('truetype'); font-weight: 300 700; font-display: swap; }
:root {
  color-scheme: light;
  --ink: #092f26;
  --lime: #c7ff23;
  --pink: #ff1693;
  --paper: #f5f7f2;
  --muted: #5b6b65;
  --font-sans: Space, -apple-system, ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
}
html, body { margin: 0; }
body { background: #fff; color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; }
#blickwinkel { padding: 20px; background: var(--paper); border-radius: 12px; }
h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.intro { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
.layout { display: flex; gap: 24px; align-items: center; }
svg { flex: 0 0 auto; width: 100%; max-width: 340px; height: auto; }
.ring { cursor: pointer; }
.ring circle { stroke: #fff; stroke-width: 2; }
.ring:focus { outline: none; }
.ring:focus-visible circle.flaeche, .ring.aktiv circle.flaeche { stroke: var(--pink); stroke-width: 5; }
.ring text { font-family: var(--font-sans); font-size: 13px; font-weight: 600; pointer-events: none; }
.quer { cursor: pointer; }
.quer:focus { outline: none; }
.quer:focus-visible line, .quer.aktiv line { stroke-width: 6; }
.panel { flex: 1; min-width: 0; padding: 16px 18px; background: #fff; border-radius: 10px; border-left: 6px solid var(--lime); }
.panel h3 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
.panel p { margin: 0 0 8px; }
.teil { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .5px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; }
.teil.hier { background: var(--lime); color: var(--ink); }
.hinweis { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
@media (max-width: 680px) { .layout { flex-direction: column; } .panel { align-self: stretch; } }
</style>
</head>
<body>
<div id="blickwinkel">
  <h2>Fünf Blickwinkel auf KI für Führungskräfte</h2>
  <p class="intro">Von innen nach außen: von Ihnen selbst bis zum ganzen Unternehmen. Klicken Sie auf einen Kreis.</p>
  <div class="layout">
    <svg viewBox="0 0 340 340" role="group" aria-label="Fünf Kreise von innen nach außen"></svg>
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>
  <p class="hinweis">Die pinke Linie läuft quer durch alle Kreise: die Frage, was aus der eigenen Rolle wird.</p>
</div>
<script>
(() => {
  const kreise = [
    { name: 'Ich selbst', kurz: 'Ich selbst',
      text: 'Die eigene Unsicherheit, die eigene Nutzung von KI und die Frage, wie ich Vorbild bin.',
      teil: 1 },
    { name: 'Mein Team', kurz: 'Mein Team',
      text: 'Erlaubnis, Rahmen, Zeit zum Ausprobieren, wer prüft und wie offen wir über KI reden.',
      teil: 1 },
    { name: 'Meine Rolle als Führungskraft', kurz: 'Meine Rolle',
      text: 'Was bleibt, wenn Routinearbeit wegfällt? Ziele setzen, Kontext geben, loslassen und Entscheidungen verantworten.',
      teil: 2 },
    { name: 'Mein Verantwortungsbereich', kurz: 'Mein Bereich',
      text: 'Welche Abläufe könnten ganz anders laufen? Welche Fähigkeiten und Stellen braucht es künftig?',
      teil: 3 },
    { name: 'Mein Unternehmen und sein Umfeld', kurz: 'Unternehmen',
      text: 'Strategie, Regeln für den Einsatz von KI, Betriebsrat und Datenschutz, Kunden und Branche.',
      teil: 3 }
  ];
  const quer = { name: 'Quer durch alle Kreise: Was wird aus meiner eigenen Rolle?',
    text: 'Welche Teile meiner Arbeit macht KI besser als ich, und was ist mein Beitrag, der bleibt? Diese Frage ist unbequem und läuft durch alle Kreise.',
    teil: 3 };
  const farben = ['#092f26', '#2d5a4c', '#5b8576', '#9bb8ac', '#d4e2dc'];
  const schrift = ['#fff', '#fff', '#fff', '#092f26', '#092f26'];
  const radien = [40, 72, 104, 136, 166];
  const svg = document.querySelector('svg');
  const panel = document.getElementById('panel');
  const ns = 'http://www.w3.org/2000/svg';
  const c = 170;
  const el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const ringe = [];

  for (let i = kreise.length - 1; i >= 0; i--) {
    const g = el('g', { class: 'ring', tabindex: 0, role: 'button', 'aria-label': kreise[i].name });
    g.appendChild(el('circle', { class: 'flaeche', cx: c, cy: c, r: radien[i], fill: farben[i] }));
    const y = i === 0 ? c + 5 : c - (radien[i] + radien[i - 1]) / 2 + 5;
    const t = el('text', { x: c, y, 'text-anchor': 'middle', fill: schrift[i] });
    t.textContent = kreise[i].kurz;
    g.appendChild(t);
    g.addEventListener('click', () => zeige(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zeige(i); } });
    svg.appendChild(g);
    ringe[i] = g;
  }
  const q = el('g', { class: 'quer', tabindex: 0, role: 'button', 'aria-label': quer.name });
  q.appendChild(el('line', { x1: c + 20, y1: c + 20, x2: c + 128, y2: c + 128, stroke: 'transparent', 'stroke-width': 18 }));
  q.appendChild(el('line', { x1: c + 20, y1: c + 20, x2: c + 128, y2: c + 128, stroke: '#ff1693', 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-dasharray': '2 8' }));
  q.addEventListener('click', () => zeige(-1));
  q.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zeige(-1); } });
  svg.appendChild(q);

  function zeige(i) {
    const k = i < 0 ? quer : kreise[i];
    ringe.forEach((g, j) => g.classList.toggle('aktiv', j === i));
    q.classList.toggle('aktiv', i < 0);
    const hier = k.teil === 1;
    panel.innerHTML = `<h3>${k.name}</h3><p>${k.text}</p>` +
      `<span class="teil${hier ? ' hier' : ''}">${hier ? 'Thema dieses Artikels' : 'Thema von Teil ' + k.teil + ' der Reihe'}</span>`;
  }
  zeige(0);
})();
</script>
</body>
</html>
